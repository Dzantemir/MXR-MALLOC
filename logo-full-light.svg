<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" width="640" height="256" role="img" aria-label="MxR-Malloc">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1D24"/>
      <stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="dram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="iram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="xtext" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="exec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
  </defs>

  <!-- ===== Icon (left) — identical to logo.svg ===== -->
  <g>
    <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>
    <rect x="6" y="6" width="244" height="244" rx="50" fill="none" stroke="#2A2E36" stroke-width="1.5"/>
    <rect x="48" y="50" width="160" height="66" rx="13" fill="#0B0D11"/>
    <rect x="48" y="50" width="160" height="66" rx="13" fill="none" stroke="#F97316" stroke-opacity="0.18" stroke-width="1"/>
    <rect x="56"  y="62" width="26" height="42" rx="4" fill="url(#dram)"/>
    <rect x="86"  y="62" width="34" height="42" rx="4" fill="url(#dram)" fill-opacity="0.92"/>
    <rect x="124" y="62" width="20" height="42" rx="4" fill="url(#dram)" fill-opacity="0.78"/>
    <rect x="148" y="62" width="52" height="42" rx="4" fill="url(#dram)" fill-opacity="0.62"/>
    <rect x="48" y="140" width="160" height="66" rx="13" fill="#0B0D11"/>
    <rect x="48" y="140" width="160" height="66" rx="13" fill="none" stroke="#14B8A6" stroke-opacity="0.18" stroke-width="1"/>
    <rect x="56"  y="152" width="44" height="42" rx="4" fill="url(#exec)"/>
    <rect x="56"  y="152" width="44" height="42" rx="4" fill="none" stroke="#CA8A04" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="108" y="152" width="24" height="42" rx="4" fill="url(#iram)"/>
    <rect x="136" y="152" width="34" height="42" rx="4" fill="url(#iram)" fill-opacity="0.85"/>
    <rect x="174" y="152" width="26" height="42" rx="4" fill="url(#iram)" fill-opacity="0.68"/>
    <rect x="104" y="117" width="48" height="22" rx="11" fill="url(#bridge)"/>
    <rect x="104" y="117" width="48" height="22" rx="11" fill="none" stroke="#0E1014" stroke-width="1.5"/>
    <g stroke="#0E1014" stroke-width="3.4" stroke-linecap="round">
      <line x1="119" y1="123" x2="137" y2="133"/>
      <line x1="137" y1="123" x2="119" y2="133"/>
    </g>
    <g fill="#2A2E36">
      <rect x="120" y="14" width="16" height="6" rx="2"/>
      <rect x="120" y="236" width="16" height="6" rx="2"/>
      <rect x="14" y="120" width="6" height="16" rx="2"/>
      <rect x="236" y="120" width="6" height="16" rx="2"/>
    </g>
  </g>

  <!-- ===== Wordmark (right) — dark text for light backgrounds ===== -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
    <text x="296" y="132" font-size="86" font-weight="800" letter-spacing="-3" fill="#111827">
      M<tspan fill="url(#xtext)">x</tspan>R
    </text>
    <text x="300" y="178" font-size="40" font-weight="500" letter-spacing="7" fill="#6B7280">MALLOC</text>
    <text x="275" y="208" font-size="13" font-weight="500" letter-spacing="1.5" fill="#9CA3AF">
      region-based allocator · ESP8266
    </text>
  </g>
</svg>
